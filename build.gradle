plugins {
    id 'java'
}

group = 'com.venthan'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

def cucumberVersion = '6.10.3'

dependencies {
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit:${cucumberVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.seleniumhq.selenium:selenium-java:3.141.59'
    // Downloads the ChromeDriver that matches the installed Chrome, so no driver binary lives in the repo
    testImplementation 'io.github.bonigarcia:webdrivermanager:4.4.3'
}

test {
    // Pass settings through, e.g. ./gradlew test -Dheadless=true -Dcucumber.filter.tags="@smoke"
    ['baseUrl', 'headless', 'chromedriver', 'cucumber.filter.tags'].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}
